[package]
name = "cosmic-ext-cwctrl"
version = "0.1.0"
edition = "2024"
rust-version = "1.86"
description = "Query and control COSMIC (Wayland) windows from the command line"
license = "MIT"
repository = "https://github.com/yeahoo/cosmic-ext-cwctrl"
authors = ["yeahoo"]
readme = "README.md"
keywords = ["cosmic", "wayland", "window", "cli", "toplevel"]
categories = ["command-line-utilities"]

# Package name is cosmic-ext-cwctrl; the command name stays short.
[[bin]]
name = "cwctrl"
path = "src/main.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Generate the COSMIC private protocol bindings from protocols/*.xml (MIT)
# instead of depending on the GPL-3.0-only cosmic-protocols crate.
wayland-scanner = "0.31"
wayland-backend = "0.3"
regex = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
